<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenlink</title>
<link rel="stylesheet" href="/style.css">
<main>
  <h1>Screenlink</h1>
  <p>Enter the code shown on the Mac. Both devices must be on the same local network.</p>
  <div id="join">
    <label for="code">Session code</label>
    <input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="numeric" pattern="[0-9]{6}" maxlength="6">
    <button id="connect">Connect</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="session" hidden>
    <p>Tap to click, drag to move items, use two fingers or a wheel to scroll, and type with your keyboard.</p>
    <img id="shot" alt="Mac screen" draggable="false">
    <button id="retry" type="button" hidden>Retry screenshot</button>
    <label for="typing">Type on the Mac</label>
    <input id="typing" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tap here for the keyboard">
    <button id="disconnect" type="button">Disconnect</button>
  </div>
</main>
<script src="/app.js"></script>
</html>
