[package]
name = "pinhole"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "pinhole"
path = "src/host/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
pem = "4"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "sync", "time"] }

[build-dependencies]
cc = "1"
